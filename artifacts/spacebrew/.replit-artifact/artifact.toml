kind = "web"
previewPath = "/"
title = "Cosmic Beans — Coffee & Brew Gear"
description = "A celestial coffee shop with small-batch beans, cups, and coffee tools, plus a responsive cart and favorites."
version = "1.0.0"
id = "artifacts/spacebrew"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19918

[services.development]
run = "pnpm --filter @workspace/spacebrew run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spacebrew", "run", "build" ]
serve = "static"
publicDir = "artifacts/spacebrew/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19918"
BASE_PATH = "/"
